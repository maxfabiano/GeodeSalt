version: '3.8'

services:
  frontend-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: vapor_landing_page
    ports:
      - "5173:5173"
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules # <-- ESTA É A MÁGICA. Isola a pasta no Linux.
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0